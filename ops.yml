dependencies:
  brew:
    - iproute2mac

actions:
  start:
    command: |-
      chmod +x ./bin/start_with_lan_ips.sh
      ./bin/start_with_lan_ips.sh
  stop:
    command: docker compose down
  restart:
    command: ops stop && ops start
  ip-list:
    command: ip -o -4 addr show up
    aliases:
      - ips
