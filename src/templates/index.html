<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Game Livestream Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <style>
        :root {
            color-scheme: light;
            --bg: #f3f0e8;
            --panel: rgba(255, 252, 245, 0.94);
            --ink: #1f1a17;
            --line: rgba(31, 26, 23, 0.12);
            --green-a: #0e9a7f;
            --green-b: #0a7c66;
            --red-a: #d9643c;
            --red-b: #b84029;
            --traffic-green-a: #008f3d;
            --traffic-green-b: #006b2d;
            --traffic-red-a: #e00000;
            --traffic-red-b: #b50000;
            --steel-a: #4c5b65;
            --steel-b: #24323c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Avenir Next", "Helvetica Neue", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, rgba(10, 124, 102, 0.18), transparent 30%),
                radial-gradient(circle at bottom right, rgba(199, 81, 46, 0.15), transparent 28%),
                linear-gradient(135deg, #f5f1e7, #e8ece9);
        }

        .layout {
            min-height: 100vh;
            padding: 24px;
        }

        @media (min-width: 577px) {
            body {
                zoom: 0.8;
            }
        }

        .board {
            display: grid;
            grid-template-columns: minmax(240px, 1fr) minmax(320px, 1.15fr) minmax(240px, 1fr);
            grid-template-areas:
                "toggle toggle toggle"
                "left preview right"
                "settings settings settings";
            gap: 20px;
            align-items: start;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 28px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 60px rgba(31, 26, 23, 0.08);
        }

        .team-panel {
            padding: 24px;
            display: grid;
            gap: 18px;
            align-content: start;
        }

        .team-top-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 96px 48px;
            gap: 14px;
            align-items: center;
        }

        .team-flags {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
        }

        .team-heading-wrap {
            display: flex;
            min-width: 0;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
        }

        .en-toggle {
            display: grid;
            justify-items: center;
            gap: 2px;
            line-height: 1;
        }

        .en-toggle input {
            margin: 0;
        }

        .penalty-controls {
            display: grid;
            gap: 10px;
        }

        .penalty-section-heading {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
        }

        .penalty-section-heading h3 {
            margin: 0;
            font-size: 1rem;
        }

        .penalty-add {
            width: 72px;
            min-height: 40px;
            border: 0;
            border-radius: 12px;
            color: white;
            background: var(--green-b);
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
        }

        .penalty-list {
            display: grid;
            gap: 6px;
        }

        .penalty-row {
            display: grid;
            grid-template-columns: 64px minmax(0, 1fr) auto auto;
            gap: 6px;
            align-items: center;
            padding: 6px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .penalty-kind-controls {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
        }

        .penalty-kind-button {
            min-height: 28px;
            padding: 3px 6px;
            border: 1px solid var(--line);
            border-radius: 6px;
            color: var(--ink);
            background: rgba(255, 255, 255, 0.72);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        .penalty-kind-button[aria-pressed="true"] {
            border-color: var(--green-b);
            color: white;
            background: var(--green-b);
        }

        .penalty-remove {
            min-width: 30px;
            min-height: 30px;
        }

        .pp-controls {
            display: grid;
            grid-template-columns: auto auto minmax(0, 1fr);
            gap: 12px;
            justify-content: initial;
            padding: 10px 12px;
        }

        .pp-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .pp-time-input {
            min-width: 0;
            padding: 12px;
            text-align: center;
            font-size: 1rem;
        }

        .team-panel.left {
            grid-area: left;
        }

        .team-panel.right {
            grid-area: right;
        }

        .preview-panel {
            grid-area: preview;
            padding: 24px;
            display: grid;
            gap: 16px;
            align-content: start;
            align-self: stretch;
        }

        .settings-panel {
            grid-area: settings;
            padding: 24px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
            gap: 16px;
            align-content: start;
        }

        .settings-left-column {
            display: grid;
            gap: 16px;
            min-width: 0;
        }

        .youtube-panel {
            display: grid;
            gap: 14px;
            padding: 18px 20px;
            border-radius: 20px;
            background: rgba(31, 26, 23, 0.05);
        }

        .youtube-status-row {
            display: grid;
            grid-template-columns: minmax(220px, 0.8fr) minmax(0, 1.2fr);
            gap: 20px;
            align-items: start;
        }

        .youtube-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .youtube-button,
        .channel-button {
            border: 0;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.98rem;
            font-weight: 800;
        }

        .youtube-button {
            padding: 14px 18px;
            color: white;
            background: linear-gradient(160deg, #b84029, #d9643c);
        }

        .youtube-button.stop-button {
            background: linear-gradient(160deg, var(--steel-a), var(--steel-b));
        }

        .channel-list {
            display: grid;
            gap: 10px;
        }

        .channel-button {
            width: 100%;
            padding: 14px 16px;
            text-align: left;
            color: var(--ink);
            background: rgba(255, 255, 255, 0.74);
            border: 1px solid var(--line);
        }

        .youtube-link {
            color: var(--steel-b);
            font-weight: 800;
            text-decoration: none;
        }

        .youtube-link:hover {
            text-decoration: underline;
        }

        .audio-copy {
            display: grid;
            grid-template-columns: max-content minmax(0, 1fr);
            gap: 6px;
        }

        .audio-copy > .status-line {
            grid-column: 1 / -1;
        }

        .audio-label {
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: rgba(31, 26, 23, 0.7);
        }

        .audio-value {
            font-size: 1.2rem;
            font-weight: 900;
        }

        .input-audio-panel {
            display: grid;
            gap: 12px;
            padding: 18px 20px;
            border-radius: 20px;
            background: rgba(31, 26, 23, 0.05);
        }

        .meter-track {
            width: 100%;
            height: 14px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(31, 26, 23, 0.12);
        }

        .meter-fill {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--red-a), #e0a834, var(--green-a));
            transition: width 160ms ease;
        }

        .meter-fill.is-silent {
            width: 2%;
        }

        .toggle-panel {
            grid-area: toggle;
        }

        .toggle-actions {
            --toggle-control-height: 116px;
            --toggle-secondary-width: 124px;
            --toggle-time-width: clamp(190px, 29vw, 270px);
            display: grid;
            grid-template-columns: var(--toggle-time-width) minmax(0, 1fr) var(--toggle-secondary-width);
            align-items: center;
            gap: 12px;
        }

        .toggle-secondary-button {
            width: var(--toggle-secondary-width);
            height: var(--toggle-control-height);
            padding: 8px;
            border: 0;
            border-radius: 16px;
            background: linear-gradient(160deg, var(--steel-a), var(--steel-b));
            color: white;
            cursor: pointer;
            font-size: 2.4rem;
            font-weight: 900;
        }

        #game-time-button {
            width: var(--toggle-time-width);
            font-size: clamp(2.8rem, 9vw, 5.5rem);
        }

        #announcement-button {
            font-size: 5rem;
        }

        .team-heading {
            flex: 1;
            min-width: 0;
            margin: 0;
            font-size: clamp(1.6rem, 3vw, 2.4rem);
            font-weight: 900;
            text-align: right;
            letter-spacing: 0.01em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        label {
            display: grid;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        input,
        select {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 16px 18px;
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.78);
            color: var(--ink);
        }

        .score-input {
            min-width: 0;
            padding: 12px 14px;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            text-align: center;
        }

        .plus-button,
        .mute-button {
            border: 0;
            border-radius: 18px;
            color: white;
            cursor: pointer;
            font-weight: 900;
        }

        .plus-button {
            width: 48px;
            height: 48px;
            padding: 0;
            border-radius: 12px;
            font-size: 1.8rem;
            background: linear-gradient(160deg, var(--green-a), var(--green-b));
        }

        .shared-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .preview-stage {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: #12181d;
        }

        .preview-warning {
            padding: 12px 16px;
            border-radius: 16px;
            background: rgba(184, 64, 41, 0.92);
            color: white;
            font-size: 0.95rem;
            font-weight: 900;
            letter-spacing: 0.01em;
            line-height: 1.25;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        }

        .preview-options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .preview-mode-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            flex: 0 1 auto;
        }

        .preview-host-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .preview-host-option select {
            width: auto;
            max-width: min(100%, 320px);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .preview-mode-option {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.7);
            font-weight: 700;
            cursor: pointer;
        }

        .preview-mode-option input[type="radio"] {
            width: 18px;
            height: 18px;
            margin: 0;
        }

        .preview-mode-option span {
            line-height: 1.2;
        }

        .preview-toggle-row {
            justify-content: flex-start;
            flex: 0 0 auto;
        }

        .advanced-button,
        .preview-dialog-close {
            padding: 12px 16px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.78);
            color: var(--ink);
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        .preview-settings-dialog {
            width: min(480px, calc(100vw - 32px));
            max-height: min(80vh, 640px);
            padding: 24px;
            border: 1px solid var(--line);
            border-radius: 20px;
            color: var(--ink);
            background: #fffdf8;
            box-shadow: 0 24px 80px rgba(31, 26, 23, 0.24);
        }

        .preview-settings-dialog::backdrop {
            background: rgba(18, 24, 29, 0.48);
            backdrop-filter: blur(3px);
        }

        .preview-dialog-content {
            display: grid;
            gap: 18px;
        }

        .preview-dialog-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .preview-dialog-header h2 {
            margin: 0;
            font-size: 1.25rem;
        }

        .preview-dialog-close {
            padding: 8px 12px;
        }

        .preview-frame,
        .preview-video,
        .overlay-mock {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .preview-video {
            display: block;
            background: #12181d;
        }

        /* Shown when "Show video" is de-selected: a frame rendered server-side
           by FFmpeg with the same overlay filters as the live stream. */
        .overlay-mock {
            display: block;
            object-fit: contain;
            background: #1b262d;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .meta {
            display: grid;
            gap: 8px;
            padding: 18px 20px;
            border-radius: 20px;
            background: rgba(31, 26, 23, 0.05);
        }

        .meta-label {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .meta-value {
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 900;
        }

        .status-line {
            font-size: 1rem;
            font-weight: 700;
        }

        #youtube-stream-health {
            white-space: pre-line;
        }

        .relay-metrics {
            min-width: 0;
        }

        .relay-metrics-controls {
            position: absolute;
            left: 42px;
            bottom: 0;
            color: #000;
            font: 700 11px "Avenir Next", "Helvetica Neue", sans-serif;
        }

        .relay-metrics-sample-time {
            position: absolute;
            right: 8px;
            bottom: 0;
            color: #000;
            font: 700 11px "Avenir Next", "Helvetica Neue", sans-serif;
            white-space: nowrap;
        }

        .relay-metrics-window {
            display: inline-flex;
            align-items: baseline;
            gap: 3px;
            white-space: nowrap;
        }

        .relay-metrics-chart-wrap {
            position: relative;
            padding-bottom: 36px;
        }

        .relay-metrics-window input {
            width: 42px;
            min-width: 0;
            padding: 1px 3px;
            border: 1px solid var(--line);
            border-radius: 4px;
            color: var(--ink);
            background: var(--panel);
            font: inherit;
            font-variant-numeric: tabular-nums;
        }

        .relay-metrics canvas {
            display: block;
            width: 100%;
            height: 232px;
        }

        .option-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 18px;
            background: rgba(31, 26, 23, 0.05);
            font-weight: 700;
        }

        .option-main {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .team-option {
            justify-content: center;
            min-height: 68px;
        }

        .option-row input[type="checkbox"] {
            width: 24px;
            height: 24px;
            margin: 0;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .clock-controls-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            align-items: end;
        }

        .clock-mode-controls {
            display: flex;
            align-items: end;
            gap: 10px;
            min-width: 0;
        }

        .clock-mode-controls .field-block {
            min-width: 0;
        }

        .clock-mode-controls .clock-button {
            flex: 0 0 auto;
        }

        .field-block {
            display: grid;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .field-label {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .clock-mode-group {
            display: inline-flex;
            gap: 8px;
            padding: 8px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.78);
            width: fit-content;
            max-width: 100%;
            flex-wrap: wrap;
        }

        .clock-mode-option {
            position: relative;
        }

        .clock-mode-option input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .clock-mode-option span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 92px;
            padding: 10px 16px;
            border-radius: 12px;
            background: transparent;
            color: rgba(31, 26, 23, 0.72);
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            transition: background 140ms ease, color 140ms ease;
        }

        .clock-mode-option input:checked + span {
            background: linear-gradient(160deg, var(--steel-a), var(--steel-b));
            color: white;
        }

        .time-control-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 48px 48px;
            align-items: center;
            gap: 6px;
        }

        .time-control-row input {
            min-width: 0;
        }

        .time-adjust-button {
            flex: 0 0 48px;
            width: 48px;
            height: 48px;
            padding: 0;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(160deg, var(--steel-a), var(--steel-b));
            color: white;
            font-size: 1.5rem;
            font-weight: 900;
            cursor: pointer;
        }

        .time-adjust-button:focus-visible {
            outline: none;
        }

        .mute-control-row {
            min-height: 0;
            gap: 8px;
            padding: 8px 10px;
        }

        .mute-control-row .option-main {
            flex: 1 1 auto;
        }

        .mute-button {
            padding: 10px 12px;
            font-size: 0.9rem;
            flex: 0 0 auto;
        }

        .mute-button {
            background: linear-gradient(160deg, var(--steel-a), var(--steel-b));
        }

        .clock-button {
            padding: 16px 18px;
            border: 0;
            border-radius: 16px;
            color: white;
            cursor: pointer;
            font-size: 0.98rem;
            font-weight: 900;
            background: linear-gradient(160deg, var(--green-a), var(--green-b));
        }

        #clock-toggle-button {
            margin: 0 0 1px;
            padding: 12px 14px;
            white-space: nowrap;
        }

        .clock-button.stopped {
            background: linear-gradient(160deg, var(--red-a), var(--red-b));
        }

        .toggle-button {
            width: 100%;
            min-height: 116px;
            border: 0;
            border-radius: 28px;
            font-size: clamp(2.8rem, 9vw, 5.5rem);
            font-weight: 900;
            letter-spacing: 0.04em;
            color: white;
            cursor: pointer;
            transition: transform 120ms ease, background 200ms ease;
            background: linear-gradient(160deg, var(--traffic-red-a), var(--traffic-red-b));
        }

        .toggle-button.keypress-ready {
            outline: 5px solid #168cff;
            outline-offset: 5px;
        }

        .toggle-button.stopped {
            background: linear-gradient(160deg, var(--traffic-green-a), var(--traffic-green-b));
        }

        .toggle-button:active,
        .toggle-secondary-button:active,
        .plus-button:active,
        .mute-button:active,
        .clock-button:active {
            transform: scale(0.99);
        }

        .is-hidden {
            display: none;
        }

        .is-disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        @media (max-width: 880px) {
            .board {
                grid-template-columns: 1fr 1fr;
                grid-template-areas:
                    "toggle toggle"
                    "left right"
                    "preview preview"
                    "settings settings";
            }

            .toggle-button {
                min-height: var(--toggle-control-height);
            }

            .toggle-actions {
                --toggle-control-height: 108px;
                --toggle-secondary-width: 116px;
                --toggle-time-width: clamp(190px, 29vw, 270px);
                grid-template-columns: var(--toggle-time-width) minmax(0, 1fr) var(--toggle-secondary-width);
                gap: 8px;
            }

            .toggle-secondary-button {
                width: var(--toggle-secondary-width);
                height: 76px;
                font-size: 2rem;
            }

            #game-time-button {
                width: var(--toggle-time-width);
                font-size: clamp(2.8rem, 9vw, 5.5rem);
            }

            #announcement-button {
                padding: 0;
                font-size: 4rem;
            }

            .clock-controls-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 576px) {
            .board {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "toggle"
                    "left"
                    "preview"
                    "right"
                    "settings"
                    ;
            }

            .shared-grid,
            .settings-grid,
            .clock-controls-grid {
                grid-template-columns: 1fr;
            }

            .settings-panel {
                grid-template-columns: 1fr;
            }

            .clock-controls-grid {
                grid-template-columns: 1fr;
            }

            .youtube-status-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body data-toggle-buffer-ms="{{ toggle_buffer_ms }}">
    <div class="layout">
        <form id="overlay-form" class="board">
            <section class="panel toggle-panel">
                <div class="toggle-actions">
                    <button id="game-time-button" class="toggle-secondary-button" type="button" aria-label="Game time">--:--</button>
                    <button id="start-stop-button" class="toggle-button stopped" type="button">Start</button>
                    <button id="announcement-button" class="toggle-secondary-button" type="button" aria-label="Outgoing audio active" title="Outgoing audio active">📣</button>
                </div>
            </section>

            <section class="panel team-panel left">
                <div class="team-top-row">
                    <div class="team-heading-wrap">
                        <label class="en-toggle" for="left-en"><span>EN</span><input type="checkbox" id="left-en"></label>
                        <h2 id="left-team-heading" class="team-heading">Left</h2>
                    </div>
                    <input type="text" id="left-score" class="score-input" value="0" inputmode="numeric">
                    <button type="button" id="left-plus" class="plus-button" aria-label="Increase left score">+</button>
                </div>
                <div class="team-flags">
                    <div class="penalty-controls">
                        <div class="penalty-section-heading">
                            <h3>Penalties</h3>
                            <button type="button" class="penalty-add" data-team="home" aria-label="Add left penalty">+</button>
                        </div>
                        <div id="left-penalties" class="penalty-list" aria-live="polite"></div>
                    </div>
                </div>
            </section>

            <section class="panel team-panel right">
                <div class="team-top-row">
                    <div class="team-heading-wrap">
                        <label class="en-toggle" for="right-en"><span>EN</span><input type="checkbox" id="right-en"></label>
                        <h2 id="right-team-heading" class="team-heading right">Right</h2>
                    </div>
                    <input type="text" id="right-score" class="score-input" value="0" inputmode="numeric">
                    <button type="button" id="right-plus" class="plus-button" aria-label="Increase right score">+</button>
                </div>
                <div class="team-flags">
                    <div class="penalty-controls">
                        <div class="penalty-section-heading">
                            <h3>Penalties</h3>
                            <button type="button" class="penalty-add" data-team="away" aria-label="Add right penalty">+</button>
                        </div>
                        <div id="right-penalties" class="penalty-list" aria-live="polite"></div>
                    </div>
                </div>
            </section>

            <section class="panel preview-panel">
                <div id="preview-audio-warning" class="preview-warning is-hidden">Warning: no audio in incoming stream</div>
                <div class="preview-stage">
                    <iframe
                        id="preview-frame"
                        class="preview-frame"
                        data-webrtc-additional-hosts="{{ webrtc_additional_hosts }}"
                        title="Live preview"
                        allow="autoplay; fullscreen; picture-in-picture"
                    ></iframe>
                    <video
                        id="preview-video"
                        class="preview-video is-hidden"
                        muted
                        autoplay
                        playsinline
                        controls
                    ></video>
                    <img id="overlay-mock" class="overlay-mock is-hidden" alt="Overlay preview">
                </div>
                <div class="preview-options">
                    <label class="option-row preview-toggle-row">
                        <input type="checkbox" id="show-video" {% if start_show_video %}checked{% endif %}>
                        <span>Show video</span>
                    </label>
                    <button type="button" id="preview-advanced-button" class="advanced-button">Advanced ⚙️</button>
                </div>
                <dialog id="preview-settings-dialog" class="preview-settings-dialog" aria-labelledby="preview-dialog-title">
                    <div class="preview-dialog-content">
                        <div class="preview-dialog-header">
                            <h2 id="preview-dialog-title">Livestream viewer advanced ⚙️</h2>
                            <button type="button" id="preview-dialog-close" class="preview-dialog-close" aria-label="Close preview settings">Close</button>
                        </div>
                        <label class="preview-host-option" id="preview-host-group" for="preview-host-select">
                            <span>WebRTC host</span>
                            <select id="preview-host-select" aria-label="WebRTC host"></select>
                        </label>
                        <div class="preview-mode-group" role="radiogroup" aria-label="Preview mode">
                            <label class="preview-mode-option" for="preview-mode-webrtc">
                                <input type="radio" id="preview-mode-webrtc" name="preview-mode" value="webrtc" checked>
                                <span>WebRTC</span>
                            </label>
                            <label class="preview-mode-option" for="preview-mode-hls">
                                <input type="radio" id="preview-mode-hls" name="preview-mode" value="hls">
                                <span>HLS</span>
                            </label>
                        </div>
                    </div>
                </dialog>
            </section>

            <section class="panel settings-panel">
                <div class="settings-left-column">
                    <div class="clock-controls-grid">
                    <label>
                        Phase
                        <select id="phase">
                            {% for phase in phases %}
                            <option value="{{ phase.name }}"{% if phase.name == initial_phase %} selected{% endif %}>{{ phase.name }}</option>
                            {% endfor %}
                        </select>
                    </label>
                    <label>
                        Time
                        <div class="time-control-row">
                            <input type="text" id="time" value="20:00">
                            <button type="button" id="time-increment" class="time-adjust-button" aria-label="Increase time by one second">+</button>
                            <button type="button" id="time-decrement" class="time-adjust-button" aria-label="Decrease time by one second">-</button>
                        </div>
                    </label>
                    <div class="clock-mode-controls">
                        <div class="field-block">
                            <div class="field-label">Clock Mode</div>
                            <div class="clock-mode-group" role="radiogroup" aria-label="Clock Mode">
                                <label class="clock-mode-option" for="clock-mode-stop-time">
                                    <input type="radio" id="clock-mode-stop-time" name="clock-mode" value="stop_time" checked>
                                    <span>Stop time</span>
                                </label>
                                <label class="clock-mode-option" for="clock-mode-run-time">
                                    <input type="radio" id="clock-mode-run-time" name="clock-mode" value="run_time">
                                    <span>Run time</span>
                                </label>
                            </div>
                        </div>
                        <button type="button" id="clock-toggle-button" class="clock-button is-hidden">Start</button>
                    </div>
                    <div class="field-block clock-audio-controls">
                        <div class="field-label">Audio</div>
                        <div class="option-row mute-control-row">
                            <label class="option-main" for="mute-on-stop">
                                <input type="checkbox" id="mute-on-stop" checked>
                                <span>Mute on Stop</span>
                            </label>
                            <button type="button" id="mute-toggle-button" class="mute-button is-hidden">Un-mute</button>
                        </div>
                    </div>
                    </div>
                    <div class="settings-grid">
                        <label>
                            Left
                            <input type="text" id="left-team" value="Left">
                        </label>
                        <label>
                            Right
                            <input type="text" id="right-team" value="Right">
                        </label>
                    </div>
                </div>
                <div class="youtube-panel">
                    <div class="youtube-status-row">
                        <div class="audio-copy">
                            <div class="audio-label">YouTube</div>
                            <div id="youtube-status" class="audio-value">Not connected</div>
                            <a id="youtube-detail" class="status-line" target="_blank" rel="noopener noreferrer">Create a stream when you are ready to go live.</a>
                            <div id="youtube-stream-health" class="status-line is-hidden"></div>
                        </div>
                        <section id="relay-metrics" class="relay-metrics is-hidden" aria-label="YouTube relay metrics">
                            <div class="relay-metrics-chart-wrap">
                                <canvas id="relay-metrics-chart" role="img" aria-label="Relay output, overall stream health, and speed over the last 15 minutes"></canvas>
                                <div id="relay-metrics-sample-time" class="relay-metrics-sample-time" aria-hidden="true"></div>
                                <div class="relay-metrics-controls">
                                    <label class="relay-metrics-window" for="relay-metrics-window">
                                        <input id="relay-metrics-window" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" value="15" aria-label="Relay chart duration in minutes">
                                        min ago
                                    </label>
                                </div>
                            </div>
                        </section>
                    </div>
                    <div class="youtube-actions">
                        <button type="button" id="create-stream-button" class="youtube-button">Create New Stream</button>
                        <a class="youtube-link" href="/youtube-stop">Stop Stream Page</a>
                    </div>
                    <div id="youtube-channel-list" class="channel-list"></div>
                </div>
            </section>

        </form>
    </div>
    <script src="/static/js/app.js?v=20261024i"></script>
</body>
</html>
