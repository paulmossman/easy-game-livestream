dependencies:
  brew:
    - iproute2mac # iproute/iproute2 on Linux.
    - ffmpeg
  custom:
    # Homebrew's Python refuses pip installs (PEP 668), so use a venv.
    - python3 -m venv .venv
  pip:
    - pyyaml
    # - requests
    # - google-cloud-firestore
    # - google-api-python-client

options:
  pip:
    command: .venv/bin/python3 -m pip

actions:
  start:
    command: |-
      chmod +x ./bin/start_with_env_vars.sh
      ./bin/start_with_env_vars.sh
  stop:
    command: docker compose down
  restart:
    command: ops stop && ops start
  ip-list:
    command: ip -o -4 addr show up ; printf "%s" "(Default)" ; route -n get 8.8.8.8 | grep interface
    aliases:
      - ips
  test:
    command: .venv/bin/python3 -m unittest discover -s tests -v
  scoresheet:
    command: .venv/bin/python3 -m src.scoresheets
  sample-stream:
    command: |-
      chmod +x ./bin/sample_stream.sh
      ./bin/sample_stream.sh
